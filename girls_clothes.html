<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أزياء وموضة النساء - متجر كارامل</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --caramel: #c89666;
            --caramel-light: #e5be96;
            --caramel-dark: #9e6d40;
            --espresso: #1c1714;
            --espresso-soft: #2e2621;
            --cream-soft: #f6efe6;
            --bg-main: #faf7f2;
            --bg-card: #ffffff;
            --text-main: #1f1b18;
            --text-muted: #6c645c;
            --border-gold: rgba(200, 150, 102, 0.28);
            --glow: rgba(200, 150, 102, 0.35);
            --shadow-card: 0 10px 26px -10px rgba(28, 23, 20, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.55;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background: rgba(28, 23, 20, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 11px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(200, 150, 102, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.14);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--cream-soft);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(200, 150, 102, 0.3);
            padding: 6px 12px;
            border-radius: 11px;
            font-size: 0.8rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--caramel);
            color: #ffffff;
            border-color: var(--caramel);
        }

        .logo-wrap {
            text-align: center;
        }

        .logo {
            font-size: 1.24rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2.2px;
            line-height: 1.1;
        }

        .logo-sub {
            font-size: 0.54rem;
            font-weight: 700;
            color: var(--caramel-light);
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .header-spacer {
            width: 78px;
        }

        .container {
            max-width: 1120px;
            width: 100%;
            margin: 0 auto;
            padding: 16px 12px 38px;
            flex: 1;
        }

        .page-header {
            text-align: right;
            margin-bottom: 14px;
            background: linear-gradient(125deg, var(--espresso) 0%, var(--espresso-soft) 65%, var(--caramel-dark) 100%);
            padding: 20px 18px;
            border-radius: 20px;
            border: 1.5px solid rgba(200, 150, 102, 0.38);
            box-shadow: 0 12px 28px -10px rgba(28, 23, 20, 0.22);
            color: #ffffff;
        }

        .page-badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--caramel-light);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(200, 150, 102, 0.32);
            padding: 2px 10px;
            border-radius: 999px;
            margin-bottom: 6px;
        }

        .page-header h1 {
            font-size: 1.42rem;
            font-weight: 900;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .page-header p {
            font-size: 0.84rem;
            color: rgba(255, 255, 255, 0.88);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .accent-bar {
            width: 46px;
            height: 3px;
            background: var(--caramel);
            border-radius: 999px;
        }

        .search-sticky-bar {
            position: sticky;
            top: 58px;
            z-index: 90;
            padding: 4px 0 8px;
            background: linear-gradient(to bottom, rgba(250, 247, 242, 0.96), rgba(250, 247, 242, 0.84));
            backdrop-filter: blur(10px);
            margin-bottom: 6px;
        }

        .search-box-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            padding: 5px;
            border-radius: 14px;
            border: 1px solid var(--border-gold);
            box-shadow: var(--shadow-card);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box-wrapper:focus-within {
            border-color: var(--caramel);
            box-shadow: 0 8px 22px rgba(200, 150, 102, 0.2);
        }

        .search-box-wrapper input {
            flex: 1;
            min-width: 0;
            height: 36px;
            padding: 0 10px;
            background: transparent;
            border: none;
            color: var(--text-main);
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }

        .search-box-wrapper input::placeholder {
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 500;
        }

        .search-btn {
            height: 36px;
            background: var(--espresso);
            color: #ffffff;
            border: none;
            padding: 0 15px;
            border-radius: 11px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: var(--caramel-dark);
        }

        .search-btn:active {
            transform: scale(0.97);
        }

        .results-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 4px 10px;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .results-count {
            color: var(--caramel-dark);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: 15px;
            overflow: hidden;
            border: 1.5px solid rgba(200, 150, 102, 0.24);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -10px rgba(28, 23, 20, 0.18);
            border-color: var(--caramel);
        }

        .product-img-box {
            width: 100%;
            height: 145px;
            background: #f2ede7;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.35s ease;
        }

        .product-card:hover .product-img-box img {
            transform: scale(1.05);
        }

        .product-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            text-align: right;
            gap: 8px;
        }

        .product-title {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 3px;
            line-height: 1.3;
        }

        .product-desc {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1.42;
            margin-bottom: 6px;
        }

        .card-line {
            width: 24px;
            height: 2px;
            background: var(--caramel);
            border-radius: 999px;
            margin-bottom: 5px;
        }

        .product-price {
            font-size: 1rem;
            font-weight: 900;
            color: var(--caramel-dark);
        }

        .product-price span {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-right: 3px;
        }

        .order-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
            padding: 7px 8px;
            background: var(--espresso);
            color: #ffffff;
            border-radius: 10px;
            font-size: 0.76rem;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        .order-btn:hover {
            background: var(--caramel-dark);
        }

        .whatsapp-icon {
            width: 15px;
            height: 15px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .empty-state {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 24px 14px;
            margin-top: 12px;
            box-shadow: var(--shadow-card);
        }

        .empty-state p {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .show-all-btn {
            background: var(--caramel-dark);
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .show-all-btn:hover {
            background: var(--espresso);
        }

        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(28, 23, 20, 0.9);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 14px;
            object-fit: contain;
            border: 1px solid rgba(229, 190, 150, 0.4);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.55);
        }

        .modal-close {
            position: absolute;
            top: 18px;
            left: 28px;
            color: var(--caramel-light);
            font-size: 2.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ffffff;
        }

        footer {
            text-align: center;
            padding: 20px 14px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(28, 23, 20, 0.08);
            margin-top: auto;
            background: #f2ede6;
        }

        @media (min-width: 768px) {
            .search-box-wrapper,
            .results-meta {
                max-width: 580px;
                margin: 0 auto;
            }

            .products-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 16px;
            }

            .product-img-box {
                height: 180px;
            }

            .product-details {
                padding: 13px;
            }

            .product-title {
                font-size: 0.92rem;
            }

            .product-desc {
                font-size: 0.76rem;
            }

            .product-price {
                font-size: 1.15rem;
            }

            .order-btn {
                padding: 9px 10px;
                font-size: 0.84rem;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="back-btn">→ الرئيسية</a>
    <div class="logo-wrap">
        <div class="logo">CARAMEL</div>
        <div class="logo-sub">WOMEN FASHION</div>
    </div>
    <div class="header-spacer"></div>
</header>

<main class="container">

    <div class="page-header">
        <div class="page-badge">CARAMEL • WOMEN FASHION</div>
        <h1>أزياء وموضة النساء</h1>
        <p>تشكيلة مختارة من الملابس والأزياء النسائية بخامات مريحة وأسعار مناسبة</p>
        <div class="accent-bar"></div>
    </div>

    <div class="search-sticky-bar">
        <div class="search-box-wrapper">
            <input
                type="text"
                id="searchQuery"
                placeholder="ابحث عن المنتج أو الوصف أو السعر"
                autocomplete="off"
            >
            <button type="button" class="search-btn" id="searchBtn">بحث</button>
        </div>
    </div>

    <div class="results-meta">
        <span>المنتجات المتاحة: <strong class="results-count" id="visibleCount">0</strong></span>
        <span id="searchHint">اكتب اسم المنتج أو السعر</span>
    </div>

    <div class="products-grid" id="productsGrid"></div>

    <div class="empty-state" id="emptyState">
        <p>مفيش منتجات مطابقة للي كتبته دلوقتي.</p>
        <button type="button" class="show-all-btn" id="showAllBtn">عرض كل المنتجات</button>
    </div>

</main>

<div class="image-modal" id="imageModal">
    <span class="modal-close" id="modalClose">&times;</span>
    <img id="modalImg" src="" alt="صورة مكبرة">
</div>

<footer>
    <p>جميع الحقوق محفوظة &copy; متجر كارامل - Caramel Store</p>
</footer>

<script>
    const whatsappNumber = "201112348224";

    const products = [
        {
            name: "أندر نسائي مشجر دباغ / كاندي",
            desc: "قطعة نسائية قطنية ناعمة بنقشة ورد بألوان متنوعة ومريحة للاستخدام اليومي، سعر القطعة الواحدة 65 جنيه.",
            price: 65,
            image: "Clswmn/compressed_1795114616012.webp",
            keywords: "اندر كلوت نسائي حريمي مشجر دباغ كاندي قطن ورد"
        }
    ];

    const grid = document.getElementById("productsGrid");
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");
    const modalClose = document.getElementById("modalClose");
    const searchInput = document.getElementById("searchQuery");
    const searchBtn = document.getElementById("searchBtn");
    const emptyState = document.getElementById("emptyState");
    const showAllBtn = document.getElementById("showAllBtn");
    const visibleCount = document.getElementById("visibleCount");
    const searchHint = document.getElementById("searchHint");

    function normalizeArabicText(text) {
        return String(text || "")
            .toLowerCase()
            .replace(/[إأآا]/g, "ا")
            .replace(/ة/g, "ه")
            .replace(/ى/g, "ي")
            .replace(/ؤ/g, "و")
            .replace(/ئ/g, "ي")
            .replace(/\s+/g, " ")
            .trim();
    }

    function openModal(imgSrc) {
        modalImg.src = imgSrc;
        modal.style.display = "flex";
    }

    function closeModal() {
        modal.style.display = "none";
        modalImg.src = "";
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.style.display === "flex") closeModal();
    });

    function createProductCard(product) {
        const message = `اريد طلب ${product.name} بسعر ${product.price} جنيه`;
        const whatsappLink = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

        const card = document.createElement("div");
        card.className = "product-card";
        card.dataset.search = normalizeArabicText(`${product.name} ${product.desc || ""} ${product.price} ${product.keywords || ""}`);

        const imgBox = document.createElement("div");
        imgBox.className = "product-img-box";
        imgBox.addEventListener("click", () => openModal(product.image));

        const img = document.createElement("img");
        img.src = product.image;
        img.alt = product.name;
        img.loading = "lazy";
        imgBox.appendChild(img);

        const details = document.createElement("div");
        details.className = "product-details";

        const infoTop = document.createElement("div");

        const title = document.createElement("div");
        title.className = "product-title";
        title.textContent = product.name;

        const desc = document.createElement("div");
        desc.className = "product-desc";
        desc.textContent = product.desc || "";

        const line = document.createElement("div");
        line.className = "card-line";

        const price = document.createElement("div");
        price.className = "product-price";
        price.innerHTML = `${product.price}<span>جنيه</span>`;

        infoTop.appendChild(title);
        if (product.desc) infoTop.appendChild(desc);
        infoTop.appendChild(line);
        infoTop.appendChild(price);

        const orderLink = document.createElement("a");
        orderLink.className = "order-btn";
        orderLink.href = whatsappLink;
        orderLink.target = "_blank";
        orderLink.rel = "noopener noreferrer";
        orderLink.innerHTML = `
            <svg class="whatsapp-icon" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.443-9.89 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.743-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.076 4.487.709.306 1.263.489 1.694.629.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/></svg>
            <span>اطلب الآن</span>
        `;

        details.appendChild(infoTop);
        details.appendChild(orderLink);

        card.appendChild(imgBox);
        card.appendChild(details);

        return card;
    }

    function renderAllProducts() {
        grid.innerHTML = "";
        const fragment = document.createDocumentFragment();
        products.forEach((product) => {
            fragment.appendChild(createProductCard(product));
        });
        grid.appendChild(fragment);
        applySearchFilter();
    }

    function applySearchFilter() {
        const query = normalizeArabicText(searchInput.value);
        const cards = grid.querySelectorAll(".product-card");
        let shown = 0;

        cards.forEach((card) => {
            const haystack = card.dataset.search || "";
            const match = !query || haystack.includes(query);
            card.style.display = match ? "flex" : "none";
            if (match) shown++;
        });

        visibleCount.textContent = shown;
        searchHint.textContent = query ? `نتائج البحث عن: "${searchInput.value.trim()}"` : "اكتب اسم المنتج أو السعر";
        emptyState.style.display = shown === 0 ? "block" : "none";
    }

    searchInput.addEventListener("input", applySearchFilter);
    searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") applySearchFilter();
    });
    searchBtn.addEventListener("click", applySearchFilter);
    showAllBtn.addEventListener("click", () => {
        searchInput.value = "";
        applySearchFilter();
    });

    renderAllProducts();
</script>

</body>
</html>
