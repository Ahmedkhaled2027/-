            display: flex;
            flex-direction: column;
            min-width: 0;

            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(38, 66, 55, 0.12);
            border-color: var(--border-soft);

            width: 100%;
            height: 150px;
            background: #f2f5f4;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.3s ease;

        { name: "طقم صواني استانلس", price: 1600, image: "IMG-20261116-WA0085.jpg", keywords: "طقم صواني صينيه ستانلس ستيل تقديم مطبخ" },
        { name: "زيت مساج", price: 70, image: "IMG-20261116-WA0104.jpg", keywords: "زيت مساج استرخاء جسم" },
        { name: "طقم 6 قطع", price: 500, image: "IMG-20261116-WA0101.jpg", keywords: "طقم 6 قطع مطبخ" },
        { name: "منظمات تخزين بغطاء وردي (3 قطع)", price: 180, image: "Kit/compressed_1795113635317.webp", keywords: "علب منظم تخزين بقوليات حبوب مطبخ وردي" },
        { name: "طقم صواني ألومنيوم مدورة (3 مقاسات)", price: 320, image: "Kit/compressed_1795113635223.webp", keywords: "صواني صينيه الومنيوم مدوره فرن مطبخ 3 مقاسات" },
        { name: "علبة تخزين شيف بوكس 2.5 لتر بغطاء أسود", price: 120, image: "Kit/compressed_1795113635125.webp", keywords: "شيف بوكس لمسه علبه تخزين 2.5 لتر مطبخ" },
        { name: "منظمات تخزين شيف بوكس 2 لتر", price: 150, image: "Kit/compressed_1795113634977.webp", keywords: "شيف بوكس لمسه علب تخزين 2 لتر حبوب بقوليات مطبخ" },
        { name: "طقم توابل الوطنية", price: 225, image: "Kit/compressed_1795115045908.webp", keywords: "طقم توابل بهارات منظم مطبخ الوطنيه" },
        { name: "مخرطة استاليس", price: 200, image: "Kit/compressed_1795115046069.webp", keywords: "مخرطه ملوخيه خضار ستانلس استيل مطبخ" },
        { name: "هراسة بطاطس", price: 25, image: "Kit/compressed_1795115069644.webp", keywords: "هراسه بطاطس هرس مطبخ" }
    ];

    const grid = document.getElementById("productsGrid");
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");
    const modalClose = document.getElementById("modalClose");
    const searchInput = document.getElementById("searchQuery");
    const searchBtn = document.getElementById("searchBtn");
    const emptyState = document.getElementById("emptyState");
    const showAllBtn = document.getElementById("showAllBtn");
    const visibleCount = document.getElementById("visibleCount");
    const searchHint = document.getElementById("searchHint");

    function normalizeArabicText(text) {
        return String(text || "")
            .toLowerCase()
            .replace(/[إأآا]/g, "ا")
            .replace(/ة/g, "ه")
            .replace(/ى/g, "ي")
            .replace(/ؤ/g, "و")
            .replace(/ئ/g, "ي")
            .replace(/\s+/g, " ")
            .trim();
    }

    function openModal(imgSrc) {
        modalImg.src = imgSrc;
        modal.style.display = "flex";
    }

    function closeModal() {
        modal.style.display = "none";
        modalImg.src = "";
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.style.display === "flex") closeModal();
    });

    function createProductCard(product) {
        const message = `اريد طلب ${product.name} بسعر ${product.price} جنيه`;
        const whatsappLink = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

        let imgSrc = product.image;
        if (!imgSrc.startsWith("Kit/") && !imgSrc.startsWith("http")) {
            imgSrc = `Kit/${imgSrc}`;
        }

        const card = document.createElement("div");
        card.className = "product-card";
        card.dataset.search = normalizeArabicText(`${product.name} ${product.price} ${product.keywords || ""}`);

        const imgBox = document.createElement("div");
        imgBox.className = "product-img-box";
        imgBox.addEventListener("click", () => openModal(imgSrc));

        const img = document.createElement("img");
        img.src = imgSrc;
        img.alt = product.name;
        img.loading = "lazy";
        imgBox.appendChild(img);

        const details = document.createElement("div");
        details.className = "product-details";

        const infoTop = document.createElement("div");

        const title = document.createElement("div");
        title.className = "product-title";
        title.textContent = product.name;

        const line = document.createElement("div");
        line.className = "card-line";

        const price = document.createElement("div");
        price.className = "product-price";
        price.innerHTML = `${product.price}<span>جنيه</span>`;

        infoTop.appendChild(title);
        infoTop.appendChild(line);
        infoTop.appendChild(price);

        const orderLink = document.createElement("a");
        orderLink.className = "order-btn";
        orderLink.href = whatsappLink;
        orderLink.target = "_blank";
        orderLink.rel = "noopener noreferrer";
        orderLink.innerHTML = `
            <svg class="whatsapp-icon" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.443-9.89 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.743-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.076 4.487.709.306 1.263.489 1.694.629.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/></svg>
            <span>اطلب الآن</span>
        `;

        details.appendChild(infoTop);
        details.appendChild(orderLink);

        card.appendChild(imgBox);
        card.appendChild(details);

        return card;
    }

    function renderAllProducts() {
        grid.innerHTML = "";
        const fragment = document.createDocumentFragment();
        products.forEach((product) => {
            fragment.appendChild(createProductCard(product));
        });
        grid.appendChild(fragment);
        applySearchFilter();
    }

    function applySearchFilter() {
        const query = normalizeArabicText(searchInput.value);
        const cards = grid.querySelectorAll(".product-card");
        let shown = 0;

        cards.forEach((card) => {
            const haystack = card.dataset.search || "";
            const match = !query || haystack.includes(query);
            card.style.display = match ? "flex" : "none";
            if (match) shown++;
        });

        visibleCount.textContent = shown;
        searchHint.textContent = query ? `نتائج البحث عن: "${searchInput.value.trim()}"` : "اكتب اسم المنتج أو السعر";
        emptyState.style.display = shown === 0 ? "block" : "none";
    }

    searchInput.addEventListener("input", applySearchFilter);
    searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") applySearchFilter();
    });
    searchBtn.addEventListener("click", applySearchFilter);
    showAllBtn.addEventListener("click", () => {
        searchInput.value = "";
        applySearchFilter();
    });

    renderAllProducts();
</script>

</body>
