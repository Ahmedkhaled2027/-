<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستلزمات المنزل - متجر كارميلا</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #b88656;
            --primary-dark: #946940;
            --bg-main: #fcf9f5;
            --dark-surface: #2b231e;
            --text-main: #2c2521;
            --text-muted: #7c726a;
            --border-light: rgba(184,134,86,.2);
            --shadow-soft: 0 4px 16px rgba(44,37,33,.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background: rgba(43,35,30,.95);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(184,134,86,.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #f5f0eb;
            background: rgba(255,255,255,.1);
            padding: 7px 14px;
            border-radius: 10px;
            font-size: .85rem;
            font-weight: 600;
            transition: .2s;
        }

        .back-btn:hover {
            background: var(--primary);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #dfb185;
            letter-spacing: 3px;
        }

        .header-spacer {
            width: 80px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 10px 40px;
            flex: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg,#f7f1eb,#f4ede3);
            padding: 25px 15px;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-soft);
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .page-header p {
            font-size: .85rem;
            color: var(--text-muted);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 10px;
        }

        .product-card {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(184,134,86,.12);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .product-img-box {
            width: 100%;
            height: 140px;
            background: #f7f4f0;
            overflow: hidden;
        }

        .product-img-link {
            display: block;
            width: 100%;
            height: 100%;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform .3s;
        }

        .product-card:hover img {
            transform: scale(1.04);
        }

        .product-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            text-align: right;
            gap: 8px;
        }

        .product-title {
            font-size: .82rem;
            font-weight: 700;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.6em;
            line-height: 1.3em;
        }

        .product-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .product-price span {
            font-size: .7rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 3px;
        }

        .order-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 8px;
            background: var(--dark-surface);
            color: #fff;
            border-radius: 8px;
            font-size: .8rem;
            font-weight: 700;
            transition: background .2s;
        }

        .order-btn:hover {
            background: var(--primary);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: .8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(184,134,86,.15);
            margin-top: auto;
            background: #f7f2ec;
        }

        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(3,minmax(0,1fr));
                gap: 16px;
            }

            .product-img-box {
                height: 180px;
            }

            .product-title {
                font-size: .95rem;
            }

            .product-price {
                font-size: 1.2rem;
            }

            .order-btn {
                padding: 10px;
                font-size: .85rem;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="back-btn">→ الرئيسية</a>
    <div class="logo">CARAMEL</div>
    <div class="header-spacer"></div>
</header>

<main class="container">

    <div class="page-header">
        <h1>مستلزمات المنزل</h1>
        <p>اختر ما يناسب منزلك واطلبه فوراً عبر الواتساب</p>
    </div>

    <div class="products-grid" id="productsGrid"></div>

</main>

<footer>
    <p>جميع الحقوق محفوظة &copy; Caramela Store</p>
</footer>

<script>

</body>
</html>
