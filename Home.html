<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستلزمات المنزل - متجر كارميلا</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #b88656;
            --primary-dark: #946940;
            --bg-main: #fcf9f5;
            --dark-surface: #2b231e;
            --text-main: #2c2521;
            --text-muted: #7c726a;
            --border-light: rgba(184,134,86,.2);
            --shadow-soft: 0 4px 16px rgba(44,37,33,.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background: rgba(43,35,30,.95);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(184,134,86,.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #f5f0eb;
            background: rgba(255,255,255,.1);
            padding: 7px 14px;
            border-radius: 10px;
            font-size: .85rem;
            font-weight: 600;
            transition: .2s;
        }

        .back-btn:hover {
            background: var(--primary);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #dfb185;
            letter-spacing: 3px;
        }

        .header-spacer {
            width: 80px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 10px 40px;
            flex: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg,#f7f1eb,#f4ede3);
            padding: 25px 15px;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-soft);
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .page-header p {
            font-size: .85rem;
            color: var(--text-muted);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 10px;
        }

        .product-card {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(184,134,86,.12);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .product-img-box {
            width: 100%;
            height: 140px;
            background: #f7f4f0;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform .3s;
        }

        .product-card:hover img {
            transform: scale(1.04);
        }

        .product-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            text-align: right;
            gap: 8px;
        }

        .product-title {
            font-size: .82rem;
            font-weight: 700;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.6em;
            line-height: 1.3em;
        }

        .product-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .product-price span {
            font-size: .7rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 3px;
        }

        .order-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 8px;
            background: var(--dark-surface);
            color: #fff;
            border-radius: 8px;
            font-size: .8rem;
            font-weight: 700;
            transition: background .2s;
        }

        .order-btn:hover {
            background: var(--primary);
        }

        /* Modal لعرض الصورة مكبرة */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
            object-fit: contain;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            left: 30px;
            color: #fff;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color .2s;
        }

        .modal-close:hover {
            color: var(--primary);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: .8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(184,134,86,.15);
            margin-top: auto;
            background: #f7f2ec;
        }

        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(3,minmax(0,1fr));
                gap: 16px;
            }

            .product-img-box {
                height: 180px;
            }

            .product-title {
                font-size: .95rem;
            }

            .product-price {
                font-size: 1.2rem;
            }

            .order-btn {
                padding: 10px;
                font-size: .85rem;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="back-btn">→ الرئيسية</a>
    <div class="logo">CARAMEL</div>
    <div class="header-spacer"></div>
</header>

<main class="container">

    <div class="page-header">
        <h1>مستلزمات المنزل</h1>
        <p>اضغط على أي صورة لتكبيرها، أو اطلب مباشرة عبر الواتساب</p>
    </div>

    <div class="products-grid" id="productsGrid"></div>

</main>

<!-- Modal لعرض الصورة -->
<div class="image-modal" id="imageModal">
    <span class="modal-close" id="modalClose">&times;</span>
    <img id="modalImg" src="" alt="صورة مكبرة">
</div>

<footer>
    <p>جميع الحقوق محفوظة &copy; Caramela Store</p>
</footer>

        { name: "شنطة حفظ حراري (بنفسجي/باندا)", price: 200, image: "[اكتب_اسم_الصورة_هنا]" },
        { name: "شنطة حفظ حراري (أسود Safeer)", price: 230, image: "[اكتب_اسم_الصورة_هنا]" },
        { name: "ستاند توابل / رف", price: 285, image: "[اكتب_اسم_الصورة_هنا]" },
        { name: "جزامة شي ان معدن 7 دور", price: 450, image: "[اكتب_اسم_الصورة_هنا]" },
        { name: "شنطة حفظ حراري كبييرة (أسود Safeer)", price: 270, image: "[اكتب_اسم_الصورة_هنا]" },

        { name: "شيالة كحك 3 دور لوكس", price: 900, image: "[اكتب_اسم_الصورة_هنا]" },

        { name: "طقم كبايات زجاج 6 قطع فخم", price: 450, image: "Kit/compressed_1794955137591.webp" },

        // المنتجات السابقة للقسم
        { name: "مصفاه متحركه", price: 300, image: "IMG-20261116-WA0059.jpg" },
        { name: "طقم 6 قطع", price: 350, image: "IMG-20261116-WA0056.jpg" },
        { name: "طقم 6 قطع", price: 250, image: "IMG-20261116-WA0057.jpg" },
        { name: "قطع 3", price: 40, image: "IMG-20261116-WA0060.jpg" },

        { name: "صنيه تحمير بالشبكه داخل الفرن", price: 260, image: "IMG-20261116-WA0063.jpg" },
        { name: "طقم تركى جرانيت", price: 2200, image: "IMG-20261116-WA0064.jpg" },
        { name: "طقم 6 قطع", price: 240, image: "IMG-20261116-WA0065.jpg" },
        { name: "طقم سكاكين أسماك", price: 850, image: "IMG-20261116-WA0066.jpg" },
        { name: "طقم مميز", price: 1800, image: "IMG-20261116-WA0071.jpg" },
        { name: "طقم 12 قطعه", price: 1500, image: "IMG-20261116-WA0075.jpg" },
        { name: "6 قطع", price: 80, image: "IMG-20261116-WA0076.jpg" },
        { name: "طقم 6 قطع بلانك ماكس", price: 250, image: "IMG-20261116-WA0081.jpg" },
        { name: "معطر روائح طبيعية", price: 100, image: "IMG-20261116-WA0082.jpg" },
        { name: "طقم صواني استانلس", price: 1600, image: "IMG-20261116-WA0085.jpg" },
        { name: "زيت مساج", price: 70, image: "IMG-20261116-WA0104.jpg" },
        { name: "طقم 6 قطع", price: 500, image: "IMG-20261116-WA0101.jpg" }
    ];

    const grid = document.getElementById("productsGrid");
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");
    const modalClose = document.getElementById("modalClose");

    modalClose.addEventListener("click", () => {
        modal.style.display = "none";
    });
    modal.addEventListener("click", (e) => {
        if (e.target === modal) {
            modal.style.display = "none";
        }
    });

    function createProduct(product) {
        const message = `اريد طلب ${product.name} بسعر ${product.price} جنيه`;
        const whatsappLink = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
        
        const imgSrc = product.image.startsWith("Kit/") || product.image.startsWith("http") ? product.image : `Kit/${product.image}`;

        const card = document.createElement("div");
        card.className = "product-card";

        const imageBox = document.createElement("div");
        imageBox.className = "product-img-box";
        
        imageBox.addEventListener("click", () => {
            modalImg.src = imgSrc;
            modal.style.display = "flex";
        });

        const image = document.createElement("img");
        image.src = imgSrc;
        image.alt = product.name;
        image.loading = "lazy";
        image.onerror = function () {
            this.style.display = "none";
            imageBox.style.background = "#eee6dc";
        };

        imageBox.appendChild(image);

        const details = document.createElement("div");
        details.className = "product-details";

        const info = document.createElement("div");

        const title = document.createElement("div");
        title.className = "product-title";
        title.textContent = product.name;

        const price = document.createElement("div");
        price.className = "product-price";
        price.textContent = product.price;

        const currency = document.createElement("span");
        currency.textContent = "جنيه";

        price.appendChild(currency);
        info.appendChild(title);
        info.appendChild(price);

        const orderButton = document.createElement("a");
        orderButton.className = "order-btn";
        orderButton.href = whatsappLink;
        orderButton.target = "_blank";
        orderButton.rel = "noopener noreferrer";
        orderButton.textContent = "اطلب الآن";

        details.appendChild(info);
        details.appendChild(orderButton);

        card.appendChild(imageBox);
        card.appendChild(details);

        return card;
    }

    const fragment = document.createDocumentFragment();

    products.forEach(product => {
        fragment.appendChild(createProduct(product));
    });

    grid.appendChild(fragment);
</script>

</body>
</html>
