<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caramela Store</title>
    <style>
        :root {
            --primary-color: #d4a373;
            --primary-glow: rgba(212, 163, 115, 0.4);
            --bg-color: #f4f0ea;
            --card-bg: #2d4a3e;
            --header-bg: #141414;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            min-height: 100vh;
        }

        header {
            padding: 24px 20px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .announcement {
            background: linear-gradient(135deg, #1f1f1f, #141414);
            padding: 20px;
            margin: 25px auto;
            max-width: 750px;
            width: 90%;
            border-radius: 16px;
            font-weight: 500;
            line-height: 1.8;
            border: 1px solid rgba(212, 163, 115, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            font-size: 0.95rem;
        }

        .contact-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px auto;
            max-width: 600px;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #d4a373, #bc8a5f);
            color: #0f0f0f;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 4px 15px var(--primary-glow);
            font-size: 0.95rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
            opacity: 0.95;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px 20px 50px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: all 0.4s ease;
        }

        .category-card:hover {
            transform: translateY(-8px);
            border-color: rgba(212, 163, 115, 0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .category-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .category-card:hover img {
            transform: scale(1.05);
        }

        .category-card h3 {
            margin: 20px 0;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        h3 {
    text-decoration: none !important;
}
    </style>
</head>
<body>

<header>
    <div class="logo">CARAMELA</div>
</header>

<div class="announcement">
    الطلب من شى أن الاوردر بنفس سعر الابليكشن ومن غير جمارك وهيوصلك خلال 10 لـ 15 يوم<br>
    الطلب من كاراميل التوصيل خلال يومين عمل
</div>

<section class="contact-section">
    <a href="https://wa.me/201112348224" class="btn">للتواصل على الواتس أب</a>
    <a href="https://play.google.com/store/apps/details?id=com.zzkko" class="btn">لتنزيل برنامج شى أن</a>
</section>

<a href="girls.html">
    <div class="category-card">
        <img src="IMG-20261116-WA0032.jpg" alt="ملابس نسائي">
        <h3>كاراميلا</h3>
    </div>
</a>
    <a href="mens.html">
    <div class="category-card">
        <img src="IMG-20261116-WA0031.jpg" alt="ملابس رجالي">
        <h3>شى أن</h3>
    </a>
    </div>
</div>

</body>
</html>
