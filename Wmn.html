<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملابس وإكسسوارات البنات - متجر كارميلا</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --berry-deep: #7a2648;
            --berry-mid: #9e335f;
            --rose-accent: #db2777;
            --rose-dark: #be185d;
            --blush-soft: #fce7f3;
            --bg-main: #fdf5f9;
            --bg-card: #ffffff;
            --text-main: #29141d;
            --text-muted: #785a68;
            --border-girls: rgba(219, 39, 119, 0.22);
            --shadow-girls: 0 6px 20px rgba(122, 38, 72, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background: var(--berry-deep);
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(252, 231, 243, 0.24);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 16px rgba(41, 20, 29, 0.14);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--blush-soft);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(252, 231, 243, 0.28);
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--rose-accent);
            color: #ffffff;
            border-color: var(--rose-accent);
        }

        .logo-wrap {
            text-align: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .logo-sub {
            font-size: 0.58rem;
            font-weight: 700;
            color: var(--blush-soft);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-spacer {
            width: 86px;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 20px 12px 40px;
            width: 100%;
            flex: 1;
        }

        .page-header {
            text-align: right;
            margin-bottom: 16px;
            background: linear-gradient(125deg, var(--berry-deep) 0%, var(--berry-mid) 68%, var(--rose-dark) 100%);
            padding: 24px 20px;
            border-radius: 20px;
            border: 1px solid rgba(252, 231, 243, 0.26);
            box-shadow: 0 10px 24px rgba(122, 38, 72, 0.15);
            color: #ffffff;
        }

        .page-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--blush-soft);
            background: rgba(255, 255, 255, 0.12);
            padding: 3px 10px;
            border-radius: 999px;
            margin-bottom: 8px;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .page-header p {
            font-size: 0.86rem;
            color: rgba(255, 255, 255, 0.92);
            margin-bottom: 12px;
        }

        .accent-bar {
            width: 48px;
            height: 3px;
            background: var(--blush-soft);
            border-radius: 999px;
        }

        .search-sticky-bar {
            position: sticky;
            top: 66px;
            z-index: 90;
            padding: 6px 0 10px;
            background: linear-gradient(to bottom, rgba(253, 245, 249, 0.96), rgba(253, 245, 249, 0.84));
            backdrop-filter: blur(10px);
            margin-bottom: 8px;
        }

        .search-box-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border-girls);
            box-shadow: var(--shadow-girls);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box-wrapper:focus-within {
            border-color: var(--rose-accent);
            box-shadow: 0 8px 22px rgba(219, 39, 119, 0.16);
        }

        .search-box-wrapper input {
            flex: 1;
            min-width: 0;
            height: 38px;
            padding: 0 12px;
            background: transparent;
            border: none;
            color: var(--text-main);
            border-radius: 10px;
            font-size: 0.86rem;
            font-weight: 600;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }

        .search-box-wrapper input::placeholder {
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 500;
        }

        .search-btn {
            height: 38px;
            background: var(--berry-deep);
            color: #ffffff;
            border: none;
            padding: 0 18px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.84rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: var(--rose-accent);
        }

        .search-btn:active {
            transform: scale(0.97);
        }

        .results-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 4px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .results-count {
            color: var(--rose-dark);
        }

        .products-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(122, 38, 72, 0.11);
            box-shadow: var(--shadow-girls);
            display: flex;
            flex-direction: column;
            width: calc(50% - 6px);
            min-width: 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(122, 38, 72, 0.13);
            border-color: var(--border-girls);
        }

        .product-img-box {
            width: 100%;
            height: 160px;
            background: #fdf2f7;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.3s ease;
        }

        .product-card:hover img {
            transform: scale(1.04);
        }

        .product-details {
            padding: 11px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            text-align: right;
            gap: 8px;
        }

        .product-title {
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.6em;
            line-height: 1.3em;
        }

        .card-line {
            width: 28px;
            height: 2px;
            background: var(--rose-accent);
            border-radius: 999px;
            margin: 6px 0;
        }

        .product-price {
            font-size: 1.08rem;
            font-weight: 800;
            color: var(--rose-dark);
        }

        .product-price span {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .order-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            padding: 9px;
            background: var(--berry-deep);
            color: #ffffff;
            border-radius: 11px;
            font-size: 0.8rem;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        .order-btn:hover {
            background: var(--rose-accent);
        }

        .whatsapp-icon {
            width: 17px;
            height: 17px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .empty-state {
            display: none;
            width: 100%;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-girls);
            border-radius: 16px;
            padding: 28px 16px;
            margin-top: 12px;
            box-shadow: var(--shadow-girls);
        }

        .empty-state p {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .show-all-btn {
            background: var(--rose-accent);
            color: #ffffff;
            border: none;
            padding: 9px 20px;
            border-radius: 11px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.84rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .show-all-btn:hover {
            background: var(--rose-dark);
        }

        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(33, 14, 23, 0.88);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 14px;
            object-fit: contain;
            border: 1px solid rgba(252, 231, 243, 0.35);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            left: 30px;
            color: var(--blush-soft);
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ffffff;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(122, 38, 72, 0.12);
            margin-top: auto;
            background: #f8ebf2;
        }

        @media (min-width: 768px) {
            .search-box-wrapper {
                max-width: 580px;
                margin: 0 auto;
            }

            .results-meta {
                max-width: 580px;
                margin: 0 auto;
            }

            .products-grid {
                gap: 16px;
            }

            .product-card {
                width: calc(33.333% - 11px);
            }

            .product-img-box {
                height: 200px;
            }

            .product-title {
                font-size: 0.95rem;
            }

            .product-price {
                font-size: 1.2rem;
            }

            .order-btn {
                padding: 10px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="back-btn">→ الرئيسية</a>
    <div class="logo-wrap">
        <div class="logo">CARAMEL</div>
        <div class="logo-sub">GIRLS FASHION & ACCESSORIES</div>
    </div>
    <div class="header-spacer"></div>
</header>

<main class="container">

    <div class="page-header">
        <div class="page-badge">CARAMEL • GIRLS COLLECTION</div>
        <h1>ملابس وإكسسوارات البنات</h1>
        <p>اضغط على أي صورة لتكبيرها، أو اطلب مباشرة عبر الواتساب</p>
        <div class="accent-bar"></div>
    </div>

    <div class="search-sticky-bar">
        <div class="search-box-wrapper">
            <input
                type="text"
                id="searchQuery"
                placeholder="ابحث عن المنتج أو السعر المناسب"
                autocomplete="off"
            >
            <button type="button" class="search-btn" id="searchBtn">بحث</button>
        </div>
    </div>

    <div class="results-meta">
        <span>المنتجات المتاحة: <strong class="results-count" id="visibleCount">0</strong></span>
        <span id="searchHint">اكتب اسم المنتج أو السعر</span>
    </div>

    <div class="products-grid" id="productsGrid"></div>

    <div class="empty-state" id="emptyState">
        <p>مفيش منتجات مطابقة للي كتبته دلوقتي.</p>
        <button type="button" class="show-all-btn" id="showAllBtn">عرض كل المنتجات</button>
    </div>

</main>

<div class="image-modal" id="imageModal">
    <span class="modal-close" id="modalClose">&times;</span>
    <img id="modalImg" src="" alt="صورة مكبرة">
</div>

<footer>
    <p>جميع الحقوق محفوظة &copy; Caramela Store</p>
</footer>

<script type="module">
    const productsData = [
        {
            name: "إكسسوار شعر أنيق",
            price: 120,
            image: "Girls/IMG-20261117-WA0001.jpg",
            keywords: "اكسسوار شعر بنات اطفال توكه ربطه هدايا"
        },
        {
            name: "طقم توك بناتى",
            price: 85,
            image: "Girls/IMG-20261117-WA0002.jpg",
            keywords: "توك توك بناتي اطفال شعر طقم ملون"
        }
    ];

    const whatsappNumber = "201055436305";
    const grid = document.getElementById("productsGrid");
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");
    const modalClose = document.getElementById("modalClose");
    const searchInput = document.getElementById("searchQuery");
    const searchBtn = document.getElementById("searchBtn");
    const emptyState = document.getElementById("emptyState");
    const showAllBtn = document.getElementById("showAllBtn");
    const visibleCount = document.getElementById("visibleCount");
    const searchHint = document.getElementById("searchHint");

    function normalizeArabicText(text) {
        return String(text || "")
            .toLowerCase()
            .replace(/[إأآا]/g, "ا")
            .replace(/ة/g, "ه")
            .replace(/ى/g, "ي")
            .replace(/ؤ/g, "و")
            .replace(/ئ/g, "ي")
            .replace(/\s+/g, " ")
            .trim();
    }

    function openModal(imgSrc) {
        modalImg.src = imgSrc;
        modal.style.display = "flex";
    }

    function closeModal() {
        modal.style.display = "none";
        modalImg.src = "";
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.style.display === "flex") closeModal();
    });

    function applySearchFilter() {
        const rawQuery = searchInput.value.trim();
        const query = normalizeArabicText(rawQuery);
        const cards = grid.querySelectorAll(".product-card");
        let matched = 0;

        cards.forEach((card) => {
            const haystack = card.dataset.search || "";
            const isMatch = !query || haystack.includes(query);
            card.style.display = isMatch ? "flex" : "none";
            if (isMatch) matched++;
        });

        visibleCount.textContent = matched;
        searchHint.textContent = rawQuery ? `نتائج البحث عن: "${rawQuery}"` : "اكتب اسم المنتج أو السعر";
        emptyState.style.display = matched === 0 ? "block" : "none";
    }

    function renderProducts() {
        grid.innerHTML = "";
        const fragment = document.createDocumentFragment();

        productsData.forEach((product) => {
            const message = `اريد طلب ${product.name} بسعر ${product.price} جنيه`;
            const whatsappLink = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

            const card = document.createElement("div");
            card.className = "product-card";
            card.dataset.search = normalizeArabicText(`${product.name} ${product.price} ${product.keywords || ""}`);

            const imgBox = document.createElement("div");
            imgBox.className = "product-img-box";
            imgBox.addEventListener("click", () => openModal(product.image));

            const img = document.createElement("img");
            img.src = product.image;
            img.alt = product.name;
            img.loading = "lazy";
            imgBox.appendChild(img);

            const details = document.createElement("div");
            details.className = "product-details";

            const infoTop = document.createElement("div");

            const title = document.createElement("div");
            title.className = "product-title";
            title.textContent = product.name;

            const line = document.createElement("div");
            line.className = "card-line";

            const price = document.createElement("div");
            price.className = "product-price";
            price.innerHTML = `${product.price}<span>جنيه</span>`;

            infoTop.appendChild(title);
            infoTop.appendChild(line);
            infoTop.appendChild(price);

            const orderLink = document.createElement("a");
            orderLink.className = "order-btn";
            orderLink.href = whatsappLink;
            orderLink.target = "_blank";
            orderLink.rel = "noopener noreferrer";
            orderLink.innerHTML = `
                <svg class="whatsapp-icon" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.443-9.89 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.743-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.076 4.487.709.306 1.263.489 1.694.629.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/></svg>
                <span>اطلب الآن</span>
            `;

            details.appendChild(infoTop);
            details.appendChild(orderLink);

            card.appendChild(imgBox);
            card.appendChild(details);

            fragment.appendChild(card);
        });

        grid.appendChild(fragment);
        applySearchFilter();
    }

    searchInput.addEventListener("input", applySearchFilter);
    searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") applySearchFilter();
    });
    searchBtn.addEventListener("click", applySearchFilter);
    showAllBtn.addEventListener("click", () => {
        searchInput.value = "";
        applySearchFilter();
    });

    renderProducts();
</script>

</body>
</html>
