<style>
:root {
    --green: #14362c;
    --green2: #1f4e3f;
    --gold: #c6a66a;
    --gold-light: #edd9ad;
    --perfume-bg-1: #fbf6f9;
    --perfume-bg-2: #f4eef7;
    --perfume-bg-3: #f9f2f4;
    --white: #ffffff;
    --ink: #1e2823;
    --muted: #767d78;
    --line: #eae2ea;
    --shadow: 0 12px 35px rgba(20, 54, 44, .09);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Cairo', sans-serif;
    background:
        radial-gradient(circle at 12% 10%, rgba(235, 198, 214, 0.34), transparent 38%),
        radial-gradient(circle at 88% 16%, rgba(213, 198, 232, 0.32), transparent 42%),
        radial-gradient(circle at 50% 85%, rgba(238, 214, 196, 0.24), transparent 45%),
        linear-gradient(180deg, var(--perfume-bg-1) 0%, var(--perfume-bg-2) 55%, var(--perfume-bg-3) 100%);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: inherit;
}

/* HEADER */
.header {
    background: rgba(16, 37, 31, .97);
    color: white;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(198,166,106,.35);
    box-shadow: 0 5px 25px rgba(0,0,0,.12);
}

.header-inner {
    max-width: 1250px;
    margin: auto;
    min-height: 70px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 30px;
    padding: 8px 15px;
    font-size: 12px;
    font-weight: 700;
    transition: .25s;
}

.back-btn:hover {
    background: var(--gold);
    color: #17251d;
}

.brand {
    text-align: center;
    line-height: 1.1;
}

.brand-name {
    color: var(--gold-light);
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
}

.brand-sub {
    font-size: 8px;
    color: #c7c9bd;
    letter-spacing: 4px;
    margin-top: 5px;
}

.header-mark {
    width: 85px;
}

/* MAIN */
.container {
    max-width: 1250px;
    padding: 25px 16px 55px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
}

/* HERO */
.hero {
    position: relative;
    overflow: hidden;
    min-height: 205px;
    padding: 30px 25px;
    border-radius: 23px;
    background:
        radial-gradient(circle at 12% 20%, rgba(198,166,106,.24), transparent 32%),
        radial-gradient(circle at 85% 75%, rgba(212,175,205,.16), transparent 38%),
        linear-gradient(120deg, #102b23, #1d4938 70%, #17372d);
    color: white;
    box-shadow: 0 15px 35px rgba(18,48,37,.16);
    display: flex;
    align-items: center;
    margin-bottom: 20px;
}

.hero::before {
    content: "C";
    position: absolute;
    left: 25px;
    top: -90px;
    font-family: Georgia, serif;
    font-size: 300px;
    line-height: 1;
    color: rgba(230,210,165,.055);
    pointer-events: none;
}

.hero-content {
    position: relative;
    z-index: 1;
}

.hero-kicker {
    color: var(--gold-light);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 9px;
}

.hero h1 {
    font-size: clamp(25px, 5vw, 39px);
    font-weight: 900;
    line-height: 1.4;
    margin-bottom: 5px;
}

.hero p {
    color: #d3d9d1;
    font-size: 12px;
    max-width: 420px;
}

.hero-line {
    width: 55px;
    height: 3px;
    border-radius: 5px;
    background: var(--gold);
    margin-top: 15px;
}

/* STICKY SEARCH BAR */
.sticky-search-bar {
    position: sticky;
    top: 74px;
    z-index: 90;
    background: rgba(251, 246, 249, 0.92);
    backdrop-filter: blur(12px);
    padding: 8px 6px;
    margin-bottom: 18px;
    border-radius: 999px;
    border: 1px solid rgba(198, 166, 106, 0.38);
    box-shadow: 0 8px 24px rgba(20, 54, 44, 0.08);
}

.search-box-wrapper {
    display: flex;
    gap: 8px;
    align-items: center;
}

.search-box-wrapper input {
    flex: 1;
    padding: 11px 18px;
    background: #ffffff;
    border: 1.5px solid var(--line);
    color: var(--ink);
    border-radius: 999px;
    font-size: 0.92rem;
    outline: none;
    font-family: 'Cairo', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.search-box-wrapper input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(198, 166, 106, 0.18);
}

.search-btn {
    background: var(--green);
    color: var(--gold-light);
    border: 1px solid rgba(198, 166, 106, 0.4);
    padding: 0 22px;
    height: 44px;
    border-radius: 999px;
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.15s;
    flex-shrink: 0;
}

.search-btn:hover {
    background: var(--gold);
    color: #15251e;
}

.search-btn:active {
    transform: scale(0.97);
}

/* SECTION TITLE */
.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 8px 2px 17px;
}

.section-heading h2 {
    font-size: 18px;
    font-weight: 900;
    color: var(--green);
}

.section-heading span {
    font-size: 10px;
    color: var(--muted);
}

        <!-- Image Zoom Modal -->
    <div id="imageModal" class="image-modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="expandedImg" alt="صورة مكبرة">
        <div id="caption"></div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const productsContainer = document.getElementById('productsContainer');
            const products = productsContainer.getElementsByClassName('product-card');
            const noResultsMsg = document.getElementById('noResultsMsg');

            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("expandedImg");
            const captionText = document.getElementById("caption");
            const span = document.getElementsByClassName("close-modal")[0];

            function performSearch() {
                const filter = searchInput.value.trim().toLowerCase();
                let visibleCount = 0;

                for (let i = 0; i < products.length; i++) {
                    const titleElement = products[i].querySelector('.product-title');
                    const priceElement = products[i].querySelector('.product-price');
                    
                    if (titleElement && priceElement) {
                        const title = titleElement.textContent || titleElement.innerText;
                        const price = priceElement.textContent || priceElement.innerText;

                        if (title.toLowerCase().indexOf(filter) > -1 || price.indexOf(filter) > -1) {
                            products[i].style.display = "";
                            visibleCount++;
                        } else {
                            products[i].style.display = "none";
                        }
                    }
                }

                if (noResultsMsg) {
                    if (visibleCount === 0) {
                        noResultsMsg.style.display = 'block';
                    } else {
                        noResultsMsg.style.display = 'none';
                    }
                }
            }

            searchBtn.addEventListener('click', performSearch);

            searchInput.addEventListener('keyup', function(event) {
                performSearch();
            });

            // Image Modal Logic
            const images = document.querySelectorAll('.product-img-box img');
            images.forEach(img => {
                img.style.cursor = 'pointer';
                img.onclick = function() {
                    modal.style.display = "flex";
                    modalImg.src = this.src;
                    const card = this.closest('.product-card');
                    if (card) {
                        const title = card.querySelector('.product-title');
                        const price = card.querySelector('.product-price');
                        if (title && price) {
                            captionText.innerHTML = `<strong>${title.innerText}</strong> - ${price.innerText}`;
                        }
                    }
                }
            });

            if(span) {
                span.onclick = function() { 
                    modal.style.display = "none";
                }
            }

            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = "none";
                }
            }

            // Close modal with Escape key
            document.addEventListener('keydown', function(event) {
                if (event.key === "Escape" && modal.style.display === "flex") {
                    modal.style.display = "none";
                }
            });
        });
    </script>
