<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العطور والبرفانات - متجر كارميلا</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* BOOM EDITION: Dark Glass Atelier + Glow Accents */
        :root {
            --bg-void: #07090f;
            --bg-elevated: rgba(17, 24, 39, 0.72);
            --bg-card: rgba(20, 27, 45, 0.78);
            --glow-amber: #f59e0b;
            --glow-cyan: #38bdf8;
            --text-pure: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.11);
            --glass-border-hover: rgba(245, 158, 11, 0.55);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-void);
            background-image:
                radial-gradient(circle at 15% 10%, rgba(245, 158, 11, 0.16), transparent 36%),
                radial-gradient(circle at 88% 22%, rgba(56, 189, 248, 0.14), transparent 38%),
                radial-gradient(circle at 50% 95%, rgba(245, 158, 11, 0.10), transparent 45%);
            color: var(--text-pure);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }

        /* هيدر زجاجي داكن بلمسة نيون خفيفة */
        header {
            background: rgba(7, 9, 15, 0.76);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-pure);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            padding: 7px 15px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            background: var(--glow-amber);
            color: #07090f;
            border-color: var(--glow-amber);
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.45);
        }

        .logo {
            font-size: 1.45rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #fde68a, #f59e0b, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-spacer { width: 80px; }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 24px 12px 52px;
            width: 100%;
            flex: 1;
        }

        /* بانر افتتاحي جريء */
        .page-header {
            text-align: center;
            margin-bottom: 22px;
            background: linear-gradient(145deg, rgba(24, 33, 56, 0.9), rgba(12, 16, 28, 0.95));
            padding: 32px 18px;
            border-radius: 26px;
            border: 1px solid rgba(245, 158, 11, 0.28);
            box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            position: relative;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 6px;
            background: linear-gradient(to left, #ffffff, #fcd34d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header p {
            font-size: 0.88rem;
            color: var(--text-dim);
        }

        /* شريط بحث زجاجي مضيء */
        .sticky-search-bar {
            position: sticky;
            top: 64px;
            z-index: 90;
            background: rgba(7, 9, 15, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 4px;
            margin-bottom: 20px;
            border-radius: 24px;
        }

        .search-box-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(18, 25, 43, 0.94);
            padding: 6px 8px;
            border-radius: 999px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .search-box-wrapper:focus-within {
            border-color: var(--glow-amber);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18), 0 12px 30px rgba(0, 0, 0, 0.65);
        }

        .search-box-wrapper input {
            flex: 1;
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: var(--text-pure);
            border-radius: 999px;
            font-size: 0.92rem;
            outline: none;
            font-family: 'Cairo', sans-serif;
            min-width: 0;
        }

        .search-box-wrapper input::placeholder {
            color: #64748b;
        }

        .clear-search-btn {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .clear-search-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .search-btn {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #07090f;
            border: none;
            padding: 0 22px;
            height: 40px;
            border-radius: 999px;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(245, 158, 11, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            flex-shrink: 0;
        }

        .search-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 24px rgba(245, 158, 11, 0.55);
        }

        /* شريط تفاصيل نتائج البحث */
        .search-meta-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            padding: 8px 14px;
            border-radius: 14px;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.22);
            font-size: 0.82rem;
            color: #fde68a;
        }

        .search-meta-badge {
            font-weight: 700;
        }

        .search-meta-hint {
            color: var(--text-dim);
            font-size: 0.76rem;
        }

        /* تظليل الحروف أو الكلمات المطابقة */
        mark.search-highlight {
            background: rgba(245, 158, 11, 0.32);
            color: #fef08a;
            padding: 0 3px;
            border-radius: 4px;
            font-weight: 800;
        }

        /* رسالة عدم وجود نتائج */
        .no-results-box {
            display: none;
            width: 100%;
            text-align: center;
            padding: 42px 20px;
            background: rgba(20, 27, 45, 0.72);
            border: 1px dashed rgba(245, 158, 11, 0.35);
            border-radius: 22px;
            color: var(--text-dim);
        }

        .no-results-box h3 {
            color: var(--text-pure);
            font-size: 1.05rem;
            margin-bottom: 6px;
        }

        .no-results-reset-btn {
            margin-top: 14px;
            background: rgba(245, 158, 11, 0.16);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
            padding: 8px 18px;
            border-radius: 999px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .no-results-reset-btn:hover {
            background: var(--glow-amber);
            color: #07090f;
        }

        /* كروت المنتجات الزجاجية المضيئة */
        .products-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .product-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            width: calc(50% - 7px);
            padding: 8px;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: var(--glass-border-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.65), 0 0 22px rgba(245, 158, 11, 0.16);
        }

        .product-img-box {
            width: 100%;
            height: 170px;
            background: #0f172a;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border-radius: 16px;
        }

        .product-img-box::after {
            content: "تكبير";
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(7, 9, 15, 0.72);
            color: #fde68a;
            border: 1px solid rgba(245, 158, 11, 0.35);
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            opacity: 0.9;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .product-card:hover .product-img-box::after {
            opacity: 1;
            transform: translateY(-2px);
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .product-card:hover .product-img-box img {
            transform: scale(1.07);
        }

        .product-details {
            padding: 12px 6px 6px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            text-align: right;
            gap: 10px;
        }

        .product-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-pure);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.6em;
            line-height: 1.35em;
        }

        .product-price {
            font-size: 1.12rem;
            font-weight: 900;
            color: #fbbf24;
            margin-top: 3px;
            display: inline-block;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.25);
            padding: 2px 10px;
            border-radius: 10px;
        }

        .product-price span {
            font-size: 0.72rem;
            font-weight: 700;
            color: #fde68a;
            margin-right: 3px;
        }

        .order-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-pure);
            border: 1px solid var(--glass-border);
            border-radius: 13px;
            font-size: 0.82rem;
            font-weight: 800;
            transition: all 0.25s ease;
        }

        .order-btn:hover,
        .product-card:hover .order-btn {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #07090f;
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
        }

        /* نافذة تكبير الصورة السينمائية */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 10, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeInModal 0.22s ease;
        }

        .modal-content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 94%;
            max-height: 90vh;
            gap: 12px;
            animation: zoomInModal 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .image-modal img {
            max-width: 100%;
            max-height: 76vh;
            border-radius: 20px;
            object-fit: contain;
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 24px 65px rgba(0, 0, 0, 0.85);
        }

        .modal-caption-bar {
            width: 100%;
            background: rgba(18, 25, 43, 0.92);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .modal-product-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-pure);
        }

        .modal-product-price {
            font-size: 1rem;
            font-weight: 900;
            color: #fbbf24;
            white-space: nowrap;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            left: 24px;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 1001;
        }

        .modal-close:hover {
            background: var(--glow-amber);
            color: #07090f;
            transform: rotate(90deg);
        }

        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomInModal {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        footer {
            text-align: center;
            padding: 22px;
            font-size: 0.82rem;
            color: var(--text-dim);
            border-top: 1px solid var(--glass-border);
            margin-top: auto;
            background: rgba(10, 14, 24, 0.9);
        }

        @media (min-width: 768px) {
            .page-header h1 { font-size: 2.15rem; }
            .products-grid { gap: 18px; }
            .product-card { width: calc(33.333% - 12px); padding: 10px; }
            .product-img-box { height: 215px; }
            .product-title { font-size: 0.95rem; }
            .product-price { font-size: 1.18rem; }
            .order-btn { padding: 11px; font-size: 0.86rem; }
        }
    </style>
</head>
