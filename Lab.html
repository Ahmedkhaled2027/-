<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتجات المكتبة والمدارس - متجر كارميلا</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink-deep: #1e3a5f;
            --ink-mid: #2b5282;
            --school-blue: #0284c7;
            --school-blue-dark: #0369a1;
            --ice-soft: #dff2fc;
            --bg-main: #f4f9fc;
            --bg-card: #ffffff;
            --text-main: #182635;
            --text-muted: #5d7082;
            --border-school: rgba(2, 132, 199, 0.22);
            --shadow-school: 0 6px 20px rgba(30, 58, 95, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        @keyframes compactBadgeEntry {
            0% {
                opacity: 0;
                transform: translateX(-40px) scale(0.6);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes cartGlowPulse {
            0%, 100% {
                transform: scale(1);
                border-color: #7dd3fc;
                box-shadow: 0 10px 24px rgba(24, 38, 53, 0.45), 0 0 14px rgba(2, 132, 199, 0.45), inset 0 0 10px rgba(223, 242, 252, 0.16);
            }
            50% {
                transform: scale(1.07);
                border-color: #e0f2fe;
                box-shadow: 0 14px 30px rgba(24, 38, 53, 0.55), 0 0 28px rgba(125, 211, 252, 0.85), inset 0 0 16px rgba(223, 242, 252, 0.35);
            }
        }

        header {
            background: var(--ink-deep);
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(223, 242, 252, 0.22);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 16px rgba(24, 38, 53, 0.14);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--ice-soft);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(223, 242, 252, 0.28);
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--school-blue);
            color: #ffffff;
            border-color: var(--school-blue);
        }

        .logo-wrap {
            text-align: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .logo-sub {
            font-size: 0.58rem;
            font-weight: 700;
            color: var(--ice-soft);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-spacer {
            width: 86px;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 20px 12px 40px;
            width: 100%;
            flex: 1;
        }

        .page-header {
            text-align: right;
            margin-bottom: 16px;
            background: linear-gradient(125deg, var(--ink-deep) 0%, var(--ink-mid) 68%, var(--school-blue-dark) 100%);
            padding: 24px 20px;
            border-radius: 20px;
            border: 1px solid rgba(223, 242, 252, 0.25);
            box-shadow: 0 10px 24px rgba(30, 58, 95, 0.15);
            color: #ffffff;
        }

        .page-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--ice-soft);
            background: rgba(255, 255, 255, 0.1);
            padding: 3px 10px;
            border-radius: 999px;
            margin-bottom: 8px;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .page-header p {
            font-size: 0.86rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
        }

        .accent-bar {
            width: 48px;
            height: 3px;
            background: var(--ice-soft);
            border-radius: 999px;
        }

        .search-sticky-bar {
            position: sticky;
            top: 66px;
            z-index: 90;
            padding: 6px 0 10px;
            background: linear-gradient(to bottom, rgba(244, 249, 252, 0.96), rgba(244, 249, 252, 0.84));
            backdrop-filter: blur(10px);
            margin-bottom: 8px;
        }

        .search-box-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border-school);
            box-shadow: var(--shadow-school);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box-wrapper:focus-within {
            border-color: var(--school-blue);
            box-shadow: 0 8px 22px rgba(2, 132, 199, 0.16);
        }

        .search-box-wrapper input {
            flex: 1;
            min-width: 0;
            height: 38px;
            padding: 0 12px;
            background: transparent;
            border: none;
            color: var(--text-main);
            border-radius: 10px;
            font-size: 0.86rem;
            font-weight: 600;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }

        .search-box-wrapper input::placeholder {
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 500;
        }

        .search-btn {
            height: 38px;
            background: var(--ink-deep);
            color: #ffffff;
            border: none;
            padding: 0 18px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.84rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: var(--school-blue);
        }

        .search-btn:active {
            transform: scale(0.97);
        }

        .results-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 4px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .results-count {
            color: var(--school-blue-dark);
        }

        .products-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(30, 58, 95, 0.11);
            box-shadow: var(--shadow-school);
            display: flex;
            flex-direction: column;
            width: calc(50% - 6px);
            min-width: 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(30, 58, 95, 0.13);
            border-color: var(--border-school);
        }

        .product-img-box {
            width: 100%;
            height: 160px;
            background: #eef6fb;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.3s ease;
        }

        .product-card:hover img {
            transform: scale(1.04);
        }

        .product-details {
            padding: 11px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            text-align: right;
            gap: 8px;
        }

        .product-title {
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.6em;
            line-height: 1.3em;
        }

        .card-line {
            width: 28px;
            height: 2px;
            background: var(--school-blue);
            border-radius: 999px;
            margin: 6px 0;
        }

        .product-price {
            font-size: 1.08rem;
            font-weight: 800;
            color: var(--school-blue-dark);
        }

        .product-price span {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .add-cart-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 8px;
            background: var(--ice-soft);
            color: var(--ink-deep);
            border: 1px solid var(--border-school);
            border-radius: 11px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .add-cart-btn:hover {
            background: var(--school-blue);
            color: #ffffff;
        }

        .order-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            padding: 9px;
            background: var(--ink-deep);
            color: #ffffff;
            border-radius: 11px;
            font-size: 0.8rem;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        .order-btn:hover {
            background: var(--school-blue);
        }

        .whatsapp-icon {
            width: 17px;
            height: 17px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .empty-state {
            display: none;
            width: 100%;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-school);
            border-radius: 16px;
            padding: 28px 16px;
            margin-top: 12px;
            box-shadow: var(--shadow-school);
        }

        .empty-state p {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .show-all-btn {
            background: var(--school-blue);
            color: #ffffff;
            border: none;
            padding: 9px 20px;
            border-radius: 11px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.84rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .show-all-btn:hover {
            background: var(--school-blue-dark);
        }

        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(14, 24, 36, 0.88);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 14px;
            object-fit: contain;
            border: 1px solid rgba(223, 242, 252, 0.35);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            left: 30px;
            color: var(--ice-soft);
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ffffff;
        }

        /* الدائرة النابضة المضيئة مع تأثير تبديل السلة والرقم */
        .floating-cart-btn {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 9990;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, var(--ink-deep), var(--ink-mid));
            color: var(--ice-soft);
            border: 2px solid #7dd3fc;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            overflow: hidden;
            animation: compactBadgeEntry 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards, cartGlowPulse 2.2s infinite ease-in-out 0.5s;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .floating-cart-btn:hover {
            animation-play-state: paused;
            transform: scale(1.1);
            border-color: #e0f2fe;
        }

        .cart-label-intro,
        .floating-cart-count {
            position: absolute;
            font-family: 'Cairo', sans-serif;
            transition: opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .cart-label-intro {
            font-size: 0.88rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.3px;
            opacity: 0;
            transform: scale(0.4) rotate(12deg);
        }

        .floating-cart-count {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--ice-soft);
            line-height: 1;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .floating-cart-btn.show-label .cart-label-intro {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .floating-cart-btn.show-label .floating-cart-count {
            opacity: 0;
            transform: scale(0.4) rotate(-12deg);
        }

        .cart-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(3px);
            z-index: 9995;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .cart-modal {
            width: 100%;
            max-width: 460px;
            max-height: 85vh;
            background: var(--bg-main);
            color: var(--text-main);
            border-radius: 20px;
            border: 1.5px solid var(--school-blue);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cart-modal-header {
            background: var(--ink-deep);
            color: #ffffff;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-close-btn {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
        }

        .cart-modal-body {
            padding: 14px 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-modal-footer {
            padding: 14px 16px;
            background: var(--bg-card);
            border-top: 1px solid rgba(30, 58, 95, 0.12);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 900;
            font-size: 1rem;
        }

        .cart-send-btn {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #2b8a3e, #1f6f31);
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
        }

        .cart-clear-btn {
            width: 100%;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(201, 42, 42, 0.35);
            background: transparent;
            color: #c92a2a;
            font-family: 'Cairo', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(30, 58, 95, 0.12);
            margin-top: auto;
            background: #e7f2f8;
        }

        @media (prefers-reduced-motion: reduce) {
            .floating-cart-btn {
                animation: none !important;
                transition: none !important;
            }
        }

        @media (min-width: 768px) {
            .search-box-wrapper {
                max-width: 580px;
                margin: 0 auto;
            }

            .results-meta {
                max-width: 580px;
                margin: 0 auto;
            }

            .products-grid {
                gap: 16px;
            }

            .product-card {
                width: calc(33.333% - 11px);
            }

            .product-img-box {
                height: 200px;
            }

            .product-title {
                font-size: 0.95rem;
            }

            .product-price {
                font-size: 1.2rem;
            }

            .order-btn {
                padding: 10px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="back-btn">→ الرئيسية</a>
    <div class="logo-wrap">
        <div class="logo">CARAMEL</div>
        <div class="logo-sub">SCHOOL & STATIONERY</div>
    </div>
    <div class="header-spacer"></div>
</header>

<main class="container">

    <div class="page-header">
        <div class="page-badge">CARAMEL • SCHOOL & BOOKS</div>
        <h1>المكتبة والمدارس</h1>
        <p>أجمل الأدوات المدرسية والمكتبية لكل احتياجات الطلاب والأسرة</p>
        <div class="accent-bar"></div>
    </div>

    <div class="search-sticky-bar">
        <div class="search-box-wrapper">
            <input
                type="text"
                id="searchQuery"
                placeholder="ابحث عن المنتج أو السعر المناسب"
                autocomplete="off"
            >
            <button type="button" class="search-btn" id="searchBtn">بحث</button>
        </div>
    </div>

    <div class="results-meta">
        <span>المنتجات المتاحة: <strong class="results-count" id="visibleCount">0</strong></span>
        <span id="searchHint">اكتب اسم المنتج أو السعر</span>
    </div>

    <div class="products-grid" id="productsGrid"></div>

    <div class="empty-state" id="emptyState">
        <p>مفيش منتجات مطابقة للي كتبته دلوقتي.</p>
        <button type="button" class="show-all-btn" id="showAllBtn">عرض كل المنتجات</button>
    </div>

</main>

<div class="image-modal" id="imageModal">
    <span class="modal-close" id="modalClose">&times;</span>
    <img id="modalImg" src="" alt="صورة مكبرة">
</div>

<footer>
    <p>جميع الحقوق محفوظة &copy; Caramela Store</p>
</footer>

<button id="caramel-floating-cart-btn" class="floating-cart-btn show-label" type="button" aria-label="فتح سلة المشتريات">
    <span class="cart-label-intro">السلة</span>
    <span id="caramel-cart-count" class="floating-cart-count">0</span>
</button>

<div id="caramel-cart-backdrop" class="cart-backdrop">
    <div id="caramel-cart-modal" class="cart-modal">
        <div class="cart-modal-header">
            <strong>سلة المشتريات</strong>
            <button id="caramel-close-cart-btn" class="cart-close-btn" type="button">✕</button>
        </div>
        <div id="caramel-cart-items" class="cart-modal-body"></div>
        <div class="cart-modal-footer">
            <div class="cart-total-row">
                <span>الإجمالي:</span>
                <span id="caramel-cart-total" style="color: var(--school-blue-dark);">0 جنيه</span>
            </div>
            <button id="caramel-send-wa-btn" class="cart-send-btn" type="button">إرسال الطلب في رسالة واحدة على واتساب</button>
            <button id="caramel-clear-cart-btn" class="cart-clear-btn" type="button">تفريغ السلة</button>
        </div>
    </div>
</div>

<script type="module">
    const CART_STORAGE_KEY = 'caramel_store_cart_v1';
    const WHATSAPP_NUMBER = '201055436305';
    let introTimer = null;

    function loadCart() {
        try {
            const raw = localStorage.getItem(CART_STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (err) {
            return [];
        }
    }

    function saveCart(items) {
        try {
            localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(items));
        } catch (err) {}
        updateBadge();
        renderModal();
    }

    function formatPrice(num) {
        return `${Number(num || 0).toLocaleString('ar-EG')} جنيه`;
    }

    function triggerLabelIntro() {
        const btn = document.getElementById('caramel-floating-cart-btn');
        if (!btn) return;
        clearTimeout(introTimer);
        btn.classList.add('show-label');
        introTimer = setTimeout(() => {
            btn.classList.remove('show-label');
        }, 1500);
    }

    function showToast(msg) {
        let toast = document.getElementById('caramel-cart-toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'caramel-cart-toast';
            toast.style.cssText = 'position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#1e3a5f;color:#fff;border:1px solid #7dd3fc;padding:10px 18px;border-radius:999px;font-family:Cairo,sans-serif;font-size:0.88rem;font-weight:700;z-index:10000;box-shadow:0 10px 24px rgba(0,0,0,0.28);white-space:nowrap;';
            document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.display = 'block';
        clearTimeout(toast._t);
        toast._t = setTimeout(() => { toast.style.display = 'none'; }, 1800);
    }

    function updateBadge() {
        const countEl = document.getElementById('caramel-cart-count');
        if (!countEl) return;
        const totalItems = loadCart().reduce((sum, item) => sum + (item.qty || 1), 0);
        countEl.textContent = totalItems;
    }

    window.addToCart = function (product) {
        if (!product || !product.name) return;
        const cart = loadCart();
        const priceNum = parseFloat(String(product.price || 0).replace(/[^\d.]/g, '')) || 0;
        const qtyNum = Math.max(1, parseInt(product.qty || 1, 10));
        const id = product.id || `${product.name.trim()}_${priceNum}`;
        const idx = cart.findIndex(item => item.id === id);
        if (idx > -1) {
            cart[idx].qty += qtyNum;
        } else {
            cart.push({
                id: id,
                name: String(product.name).trim(),
                price: priceNum,
                qty: qtyNum,
                image: product.image || ''
            });
        }
        saveCart(cart);
        const btn = document.getElementById('caramel-floating-cart-btn');
        if (btn) btn.classList.remove('show-label');
        showToast(`تمت إضافة "${product.name}" إلى السلة`);
    };

    window.updateCartQty = function (id, delta) {
        const cart = loadCart();
        const index = cart.findIndex(item => item.id === id);
        if (index === -1) return;
        cart[index].qty += delta;
        if (cart[index].qty <= 0) cart.splice(index, 1);
        saveCart(cart);
    };

    window.removeFromCart = function (id) {
        saveCart(loadCart().filter(item => item.id !== id));
    };

    window.clearCart = function () {
        saveCart([]);
    };

    window.sendCartToWhatsApp = function () {
        const cart = loadCart();
        if (!cart.length) {
            showToast('السلة فارغة، أضف منتجات أولاً');
            return;
        }
        let total = 0;
        const lines = cart.map((item, i) => {
            const sub = item.price * item.qty;
            total += sub;
            return `${i + 1}. *${item.name}* — الكمية: ${item.qty} × ${item.price} جنيه = *${sub} جنيه*`;
        });
        const text = [
            'مرحباً متجر كارامل، أرغب في تأكيد الطلب التالي:',
            '',
            ...lines,
            '',
            `الإجمالي الكلي: *${total} جنيه*`
        ].join('\n');
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank', 'noopener,noreferrer');
    };

    function renderModal() {
        const listEl = document.getElementById('caramel-cart-items');
        const totalEl = document.getElementById('caramel-cart-total');
        if (!listEl || !totalEl) return;

        const cart = loadCart();
        if (!cart.length) {
            listEl.innerHTML = '<p style="text-align:center;color:#5d7082;padding:24px 8px;font-weight:700;">السلة فارغة حالياً.</p>';
            totalEl.textContent = formatPrice(0);
            return;
        }

        let total = 0;
        listEl.innerHTML = cart.map(item => {
            const sub = item.price * item.qty;
            total += sub;
            const safeId = String(item.id).replace(/'/g, "\\'");
            return `
                <div style="background:#fff;border:1px solid rgba(30,58,95,0.12);border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
                    <div style="flex:1;min-width:0;">

                        <div style="font-size:0.8rem;color:#5d7082;font-weight:700;">${item.price} جنيه × ${item.qty} = ${sub} جنيه</div>

                    <div style="display:flex;align-items:center;gap:6px;">
                        <button type="button" onclick="updateCartQty('${safeId}', 1)" style="width:26px;height:26px;border-radius:8px;border:1px solid #ccc;background:#dff2fc;font-weight:900;cursor:pointer;">+</button>

                    </div>
                </div>
            `;
        }).join('');

    function normalizeArabicText(text) {
        return String(text || "")
            .toLowerCase()
            .replace(/[إأآا]/g, "ا")
            .replace(/ة/g, "ه")
            .replace(/ى/g, "ي")
            .replace(/ؤ/g, "و")
            .replace(/ئ/g, "ي")
            .replace(/\s+/g, " ")
            .trim();
    }

    function parseNumericPrice(priceVal) {
        if (typeof priceVal === "number") return priceVal;
        const match = String(priceVal || "").match(/[\d.]+/);
        return match ? parseFloat(match[0]) : 0;
    }

    function openModal(imgSrc) {
        modalImg.src = imgSrc;
        modal.style.display = "flex";
    }

    function closeModal() {
        modal.style.display = "none";
        modalImg.src = "";
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.style.display === "flex") closeModal();
    });

    function applySearchFilter() {
        const rawQuery = searchInput.value.trim();
        const query = normalizeArabicText(rawQuery);
        const cards = grid.querySelectorAll(".product-card");
        let matched = 0;

        cards.forEach((card) => {
            const haystack = card.dataset.search || "";
            const isMatch = !query || haystack.includes(query);
            card.style.display = isMatch ? "flex" : "none";
            if (isMatch) matched++;
        });

        visibleCount.textContent = matched;
        searchHint.textContent = rawQuery ? `نتائج البحث عن: "${rawQuery}"` : "اكتب اسم المنتج أو السعر";
        emptyState.style.display = matched === 0 ? "block" : "none";
    }
