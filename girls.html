<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أقسام المتجر - متجر كارميلا</title>

    <!-- خط Cairo العصري -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #c89666;
            --primary-dark: #a67649;
            --bg-main: #faf8f5;
            --bg-card: #ffffff;
            --dark-surface: #181512;
            --text-main: #221f1d;
            --text-muted: #6e6761;
            --border-light: rgba(200, 150, 102, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* الهيدر العلوي */
        header {
            background: rgba(24, 21, 18, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #f3ede6;
            background: rgba(255, 255, 255, 0.08);
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: var(--primary-dark);
            color: #fff;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .header-spacer {
            width: 80px;
        }

        /* الحاوية الرئيسية */
        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 25px 16px 50px;
            width: 100%;
            flex: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .page-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* شبكة عرض الأقسام */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* بطاقة القسم */
        .category-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 8px 25px -8px rgba(24, 21, 18, 0.07);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 35px -10px rgba(200, 150, 102, 0.25);
            border-color: var(--border-light);
        }

        .category-img-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #f2ede7;
            overflow: hidden;
            position: relative;
        }

        .category-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .category-card:hover .category-img-box img {
            transform: scale(1.06);
        }

        .category-footer {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
        }

        .category-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .arrow-icon {
            width: 36px;
            height: 36px;
            background: var(--bg-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-dark);
            transition: background 0.2s, color 0.2s;
        }

        .category-card:hover .arrow-icon {
            background: var(--dark-surface);
            color: #fff;
        }

        /* الفوتر */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            margin-top: auto;
        }

        /* تحسين التجاوب مع الموبايل */
        @media (max-width: 540px) {
            .categories-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .category-card {
                border-radius: 16px;
            }
            .category-footer {
                padding: 12px;
            }
            .category-name {
                font-size: 0.9rem;
            }
            .arrow-icon {
                width: 30px;
                height: 30px;
            }
            .header-spacer {
                display: none;
            }
        }
    </style>
</head>
<body>
